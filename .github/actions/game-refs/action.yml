name: Game reference assemblies
description: >
  Fetches the game build's reference assemblies that ci/game-refs.json names (its default build,
  or the input `build`) into a folder laid out like a game install, checking every file's SHA-256
  (scripts/fetch-game-refs.py). It reads the private refs repository with a short-lived token of
  the GitHub App oni-moono-refs-reader (Contents read-only, installed on that repository alone),
  minted for the fetch and held only in its environment.
inputs:
  app-id:
    description: The refs-reading GitHub App's ID (variable REFS_APP_ID).
    required: true
  app-key:
    description: The refs-reading GitHub App's private key (secret REFS_APP_KEY).
    required: true
  use-cache:
    description: Restore and save the folder in the Actions cache (never for release builds).
    default: "true"
  build:
    description: A game build of the manifest other than its default build.
    default: ""
outputs:
  game-dir:
    description: The folder to build against (-p:OniGameDir, ONI_GAME_DIR), with forward slashes.
    value: ${{ steps.dir.outputs.game-dir }}
runs:
  using: composite
  steps:
    - id: dir
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
      run: |
        py=python3; python3 -c "" 2>/dev/null || py=python
        build="${BUILD:-$($py -I scripts/fetch-game-refs.py --print-default-build)}"
        [[ "$build" =~ ^[0-9]+$ ]] || { echo "::error::a game build is a number, not '$build'"; exit 1; }
        dir="${RUNNER_TEMP//\\//}/game-refs-$build"
        echo "build=$build" >> "$GITHUB_OUTPUT"
        echo "game-dir=$dir" >> "$GITHUB_OUTPUT"
    - if: inputs.use-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.game-dir }}
        key: game-refs-${{ steps.dir.outputs.build }}-${{ hashFiles('ci/game-refs.json') }}
    - shell: bash
      env:
        HAVE_KEY: ${{ inputs.app-key != '' }}
      run: |
        [ "$HAVE_KEY" = true ] || { echo "::error::REFS_APP_KEY is not available to this run"; exit 1; }
    - id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        owner: tigin-backwards
        repositories: oni-moono-refs
        permission-contents: read
    - shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        GAME_DIR: ${{ steps.dir.outputs.game-dir }}
        BUILD: ${{ steps.dir.outputs.build }}
      run: |
        py=python3; python3 -c "" 2>/dev/null || py=python
        # A restored cache is checked file by file like a fetch (--reuse); a miss fetches.
        $py -I scripts/fetch-game-refs.py "$GAME_DIR" --build "$BUILD" --reuse
