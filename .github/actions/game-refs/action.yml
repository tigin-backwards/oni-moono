name: Game reference assemblies
description: >
  Fetches the game build's reference assemblies that ci/game-refs.json names (its default build)
  into a folder laid out like a game install, checking every file's SHA-256
  (scripts/fetch-game-refs.py). The deploy key reads the private refs repository; it is held in
  an ssh-agent for the fetch only, never written to disk.
inputs:
  deploy-key:
    description: The refs repository's read-only deploy key (secret GAME_REFS_DEPLOY_KEY).
    required: true
  use-cache:
    description: Restore and save the folder in the Actions cache (never for release builds).
    default: "true"
outputs:
  game-dir:
    description: The folder to build against (-p:OniGameDir, ONI_GAME_DIR), with forward slashes.
    value: ${{ steps.dir.outputs.game-dir }}
runs:
  using: composite
  steps:
    - id: dir
      shell: bash
      run: |
        py=python3; python3 -c "" 2>/dev/null || py=python
        build="$($py -I scripts/fetch-game-refs.py --print-default-build)"
        dir="${RUNNER_TEMP//\\//}/game-refs-$build"
        echo "build=$build" >> "$GITHUB_OUTPUT"
        echo "game-dir=$dir" >> "$GITHUB_OUTPUT"
    - if: inputs.use-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.game-dir }}
        key: game-refs-${{ steps.dir.outputs.build }}-${{ hashFiles('ci/game-refs.json') }}
    - shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
        GAME_DIR: ${{ steps.dir.outputs.game-dir }}
      run: |
        py=python3; python3 -c "" 2>/dev/null || py=python
        [ -n "$DEPLOY_KEY" ] || { echo "::error::GAME_REFS_DEPLOY_KEY is not available to this run"; exit 1; }
        eval "$(ssh-agent -s)" > /dev/null
        trap 'ssh-agent -k > /dev/null' EXIT
        printf '%s\n' "$DEPLOY_KEY" | ssh-add -q -
        export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/ci/github-known-hosts"
        # A restored cache is checked file by file like a fetch (--reuse); a miss fetches.
        $py -I scripts/fetch-game-refs.py "$GAME_DIR" --transport ssh --reuse
