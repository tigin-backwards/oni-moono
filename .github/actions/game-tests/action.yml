name: Game tests
description: >
  Runs scripts/ci-game-tests.sh LIST on the stripped game (docs/DEVELOPMENT.md, "Game tests in
  CI"): fetches this branch's stripped build and the fixture saves the list loads from the private
  refs repository's release assets by the hashes in ci/game-content.json and
  tests/e2e/fixtures.json (with a short-lived token of the GitHub App oni-moono-refs-reader,
  Contents read-only on that repository alone, held only in the fetch step's environment), builds the DLC-owning Steam double and OniMcp (scripts/onimcp.py,
  from its author's repository; a fresh build each run), and runs the list. Nothing is cached or
  uploaded: the game, the saves and the players' logs and dumps stay on the runner. Without the
  app's key (a fork's run) it does nothing and says so.
inputs:
  app-id:
    description: The refs-reading GitHub App's ID (variable REFS_APP_ID).
    required: true
  app-key:
    description: The refs-reading GitHub App's private key (secret REFS_APP_KEY).
    required: true
  list:
    description: push or nightly (ci/game-tests/LIST.txt).
    required: true
  saves:
    description: The fixtures the list loads, space-separated (tests/e2e/fixtures.json names).
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        HAVE_KEY: ${{ inputs.app-key != '' }}
      run: |
        if [ "$HAVE_KEY" = true ]; then echo "have=true" >> "$GITHUB_OUTPUT"
        else echo "::notice::No REFS_APP_KEY in this run (a fork's): the game tests are skipped."; echo "have=false" >> "$GITHUB_OUTPUT"; fi
    # FreeSans, DejaVu Sans and Liberation Sans: the fonts Unity's player falls back to on Linux,
    # which the engine's text measures with as the original does (FontNative's default chain).
    - if: steps.key.outputs.have == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends xvfb x11-xkb-utils libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxtst6 python3-yaml zstd binutils \
          fonts-freefont-ttf fonts-dejavu-core fonts-liberation > /dev/null
        # DejaVu's core faces only, as a desktop has them: an ExtraLight face (fonts-dejavu-extra,
        # if the image has it) shares the family name, sorts first and lacks glyphs tests measure.
        sudo apt-get remove -y -qq fonts-dejavu-extra > /dev/null 2>&1 || true
        ls /usr/share/fonts/truetype/dejavu
    - if: steps.key.outputs.have == 'true'
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        owner: tigin-backwards
        repositories: oni-moono-refs
        permission-contents: read
    - if: steps.key.outputs.have == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SAVES: ${{ inputs.saves }}
      run: |
        python3 -I scripts/fetch-game-content.py game "$RUNNER_TEMP/oni-game"
        # shellcheck disable=SC2086  # a space-separated list
        python3 -I scripts/fetch-game-content.py saves $SAVES
    - if: steps.key.outputs.have == 'true'
      shell: bash
      run: |
        echo "QA_U57_STEAM=$(tools/SteamStub/build.sh --dlc)" >> "$GITHUB_ENV"
        ONI_GAME_DIR="$RUNNER_TEMP/oni-game" python3 -I scripts/onimcp.py "$RUNNER_TEMP/onimcp"
        echo "E2E_ONIMCP=$RUNNER_TEMP/onimcp" >> "$GITHUB_ENV"
    - if: steps.key.outputs.have == 'true'
      shell: bash
      env:
        LIST: ${{ inputs.list }}
      run: scripts/ci-game-tests.sh "$LIST" "$RUNNER_TEMP/oni-game"
