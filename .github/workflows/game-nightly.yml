# The nightly game tests on the stripped game (docs/DEVELOPMENT.md, "Game tests in CI"):
# ci/game-tests/nightly.txt's UI and mod-loading specs and the long verify run, and the perf
# gates (perf-spread.yml, docs/PERFORMANCE.md "Perf gates in the nightly"). Scheduled runs
# test the default branch (master, U59); run it by hand on u60 for U60.
name: Game tests (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run only these specs of nightly.txt, space-separated; empty runs them all.
        type: string
        default: ""

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  game:
    name: Nightly game tests (stripped game)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exactly global.json's SDK, alone in a folder of its own (build.yml says why).
      - id: sdk
        run: echo "version=$(python3 -I -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          skip-lts-prepass: true
      - uses: ./.github/actions/game-tests
        with:
          app-id: ${{ vars.REFS_APP_ID }}
          app-key: ${{ secrets.REFS_APP_KEY }}
          list: nightly
          only: ${{ inputs.only }}
          saves: early-base 2minnow
  # The last release against this commit on early-base, three pairs in turn (about an hour):
  # draws and collections must not rise, allocations within their tolerances; the main thread's
  # time only warns. Left out of a by-hand run of chosen specs.
  perf:
    name: Nightly perf gates
    if: inputs.only == '' || inputs.only == null
    permissions:
      contents: read
    uses: ./.github/workflows/perf-spread.yml
    with:
      base: ""
      save: early-base
      pairs: 3
      window: 300
      pause_windows: 2
      run_windows: 3
      launch_minutes: 9
      args: ""
      b_args: ""
      jobs: "[1]"
      gate: true
      launch_step_minutes: 55
      job_minutes: 70
    secrets:
      REFS_APP_KEY: ${{ secrets.REFS_APP_KEY }}
