# How steady GitHub's runners are for perf numbers (scripts/perf-spread.py, docs/PERFORMANCE.md
# "Perf spread on CI's runners"): on the stripped game, the last release (A) and this commit (B)
# launched in turn, A B A B ..., on the same save, each launch measuring the colony paused and
# then running with PerfProbe and --frame-stats. By hand, three jobs, so three runner machines;
# game-nightly.yml calls it for one job with `gate` on, which fails the job when B's counts pass
# their gates (scripts/perf-spread.py gate). Never on push. Like the game tests, it uploads no game
# files, saves or logs: the artifact holds the numbers alone.
name: Perf spread

on:
  workflow_dispatch:
    inputs:
      base:
        description: The A build's tag; empty takes the latest release tag this commit contains.
        type: string
        default: ""
      save:
        description: The fixture both load (tests/e2e/fixtures.json).
        type: choice
        options: [early-base, 2minnow]
        default: early-base
      pairs:
        description: A B pairs a job launches.
        type: number
        default: 5
      window:
        description: Frames a window (CI's software renderer runs about 6 fps on early-base, 1 on 2minnow).
        type: number
        default: 300
      pause_windows:
        description: Windows paused (the first has no counters).
        type: number
        default: 3
      run_windows:
        description: Windows running at speed 3 (the first is left out).
        type: number
        default: 4
      launch_minutes:
        description: A launch is stopped after this long, with what it has.
        type: number
        default: 14
      args:
        description: More player arguments for both, such as --game-tweak exact.
        type: string
        default: ""
      b_args:
        description: More player arguments for B alone, such as --game-tweak -NAME for a tweak A lacks.
        type: string
        default: ""
      jobs:
        description: The jobs, as a JSON list (one runner machine each).
        type: string
        default: "[1, 2, 3]"
      gate:
        description: Fail the job when B's counts pass their gates against A.
        type: boolean
        default: false
      launch_step_minutes:
        description: The launches' step is stopped after this long, leaving time for the summary.
        type: number
        default: 120
      job_minutes:
        description: The job's timeout.
        type: number
        default: 150
  workflow_call:
    inputs:
      base:
        description: The A build's tag; empty takes the latest release tag this commit contains.
        type: string
        default: ""
      save:
        description: The fixture both load (tests/e2e/fixtures.json).
        type: string
        default: early-base
      pairs:
        description: A B pairs a job launches.
        type: number
        default: 5
      window:
        description: Frames a window (CI's software renderer runs about 6 fps on early-base, 1 on 2minnow).
        type: number
        default: 300
      pause_windows:
        description: Windows paused (the first has no counters).
        type: number
        default: 3
      run_windows:
        description: Windows running at speed 3 (the first is left out).
        type: number
        default: 4
      launch_minutes:
        description: A launch is stopped after this long, with what it has.
        type: number
        default: 14
      args:
        description: More player arguments for both, such as --game-tweak exact.
        type: string
        default: ""
      b_args:
        description: More player arguments for B alone, such as --game-tweak -NAME for a tweak A lacks.
        type: string
        default: ""
      jobs:
        description: The jobs, as a JSON list (one runner machine each).
        type: string
        default: "[1, 2, 3]"
      gate:
        description: Fail the job when B's counts pass their gates against A.
        type: boolean
        default: false
      launch_step_minutes:
        description: The launches' step is stopped after this long, leaving time for the summary.
        type: number
        default: 120
      job_minutes:
        description: The job's timeout.
        type: number
        default: 150
    secrets:
      REFS_APP_KEY:
        required: true

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  spread:
    name: Perf spread ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.job_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Exactly global.json's SDK, alone in a folder of its own (build.yml says why).
      - id: sdk
        run: echo "version=$(python3 -I -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          skip-lts-prepass: true
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-xkb-utils libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxtst6 zstd binutils \
            fonts-freefont-ttf fonts-dejavu-core fonts-liberation > /dev/null
          sudo apt-get remove -y -qq fonts-dejavu-extra > /dev/null 2>&1 || true
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REFS_APP_ID }}
          private-key: ${{ secrets.REFS_APP_KEY }}
          owner: tigin-backwards
          repositories: oni-moono-refs
          permission-contents: read
      - name: The stripped game and the save
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SAVE: ${{ inputs.save }}
        run: |
          python3 -I scripts/fetch-game-content.py game "$RUNNER_TEMP/oni-game"
          python3 -I scripts/fetch-game-content.py saves "$SAVE"
      - name: Build A (the release) and B (this commit)
        env:
          BASE: ${{ inputs.base }}
        run: |
          base="$BASE"
          # The branch's last release: each branch's history holds its own releases' tags only
          # (u60's pre-releases are not in master's, nor master's in u60's).
          [ -n "$base" ] || base=$(git tag --merged HEAD --sort=-creatordate --list 'v*' | head -1)
          [ -n "$base" ] || { echo "no release tag in this commit's history"; exit 1; }
          echo "A: $base ($(git rev-parse --short "$base^{commit}")), B: $(git rev-parse --short HEAD)"
          { echo "SPREAD_A=$base"; echo "SPREAD_B=$(git rev-parse --short HEAD)"; } >> "$GITHUB_ENV"
          git worktree add -q "$RUNNER_TEMP/base" "$base"
          game="$RUNNER_TEMP/oni-game"
          for tree in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
            dotnet build "$tree/src/OniMoono.Host" -c Release -p:OniGameDir="$game" -v q -nologo "-clp:ErrorsOnly;NoSummary"
          done
          dotnet build tools/PerfProbe -c Release -p:OniManaged="$game/OxygenNotIncluded_Data/Managed" -v q -nologo "-clp:ErrorsOnly;NoSummary"
          echo "SPREAD_STEAM=$(tools/SteamStub/build.sh --dlc)" >> "$GITHUB_ENV"
      # The step's own timeout, inside the job's, leaves time for the summary and the upload:
      # each launch writes its result.json as it ends, so a cut-short step still has numbers.
      - name: Launch A and B in turn
        timeout-minutes: ${{ inputs.launch_step_minutes }}
        env:
          SAVE: ${{ inputs.save }}
          PAIRS: ${{ inputs.pairs }}
          WINDOW: ${{ inputs.window }}
          PAUSE_WINDOWS: ${{ inputs.pause_windows }}
          RUN_WINDOWS: ${{ inputs.run_windows }}
          LAUNCH_MINUTES: ${{ inputs.launch_minutes }}
          ARGS: ${{ inputs.args }}
          B_ARGS: ${{ inputs.b_args }}
        run: |
          export ONI_NO_CONTENT=1 SPREAD_GAME="$RUNNER_TEMP/oni-game" SPREAD_PROBE="$PWD/out/bin/PerfProbe/release" SPREAD_SAVE="$PWD/tests/e2e/fixtures/$SAVE.sav"
          # 960x540: Mesa's software renderer is the slowest part, and its cost goes with the pixels.
          Xvfb :99 -screen 0 960x540x24 -nolisten tcp > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          spread="$RUNNER_TEMP/spread"
          mkdir -p out/perf-spread/runs
          launch() { # launch TREE NAME LABEL PAUSE RUN SECONDS [HOST ARGS]
            scripts/perf-spread.py run "$1" "$spread/$2" --label "$3" --window "$WINDOW" --size 960x540 \
              --pause-windows "$4" --run-windows "$5" --timeout "$6" --host-args "${7:-}" || true
            if [ -f "$spread/$2/result.json" ] && [[ "$2" == [0-9]* ]]; then
              mkdir -p "out/perf-spread/runs/$2"
              cp "$spread/$2/result.json" "out/perf-spread/runs/$2/"
            fi
          }
          # A warm-up launch of each first (disk caches, the first JIT), not counted.
          launch "$RUNNER_TEMP/base" warm-A A 1 0 600 "$ARGS"
          launch . warm-B B 1 0 600 "$ARGS $B_ARGS"
          for i in $(seq 1 "$PAIRS"); do
            launch "$RUNNER_TEMP/base" "$i-A" A "$PAUSE_WINDOWS" "$RUN_WINDOWS" $((LAUNCH_MINUTES * 60)) "$ARGS"
            launch . "$i-B" B "$PAUSE_WINDOWS" "$RUN_WINDOWS" $((LAUNCH_MINUTES * 60)) "$ARGS $B_ARGS"
          done
          # With B's own arguments, one more B launch without them, not counted: whether B gets
          # through without them (its error lines if not).
          [ -z "$B_ARGS" ] || launch . probe-B B 1 0 300
      - name: Summary
        if: always()
        env:
          SAVE: ${{ inputs.save }}
        run: |
          # Glob order (1-A, 1-B, 10-A, ...) keeps each A with its B.
          shopt -s nullglob
          runs=(out/perf-spread/runs/*)
          if [ ${#runs[@]} -eq 0 ]; then echo "No launch finished." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          scripts/perf-spread.py summary --a "${SPREAD_A:-the release}" --b "${SPREAD_B:-this commit}" --save "$SAVE" out/perf-spread "${runs[@]}" > /dev/null
          cat out/perf-spread/summary.md >> "$GITHUB_STEP_SUMMARY"
      # The nightly's gates (scripts/perf-spread.py gate): counts only, the CPU model logged.
      - name: Gates
        if: always() && inputs.gate
        run: |
          # The summary above shows each check; this step only fails the job on a failed one.
          [ -f out/perf-spread/summary.json ] || { echo "No summary: no launch finished."; exit 1; }
          scripts/perf-spread.py gate out/perf-spread/summary.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-spread-${{ matrix.job }}
          path: |
            out/perf-spread/summary.json
            out/perf-spread/summary.md
            out/perf-spread/runs/*/result.json
          if-no-files-found: warn
