# Issue #45: a player's Ceres colony (cycle 150) logged "Exception in:
# (SpaceTreeBranch).SpaceTreeBranch.GoTo(root.halt.wilted)", a NullReferenceException in
# SpaceTreeBranch.Instance.get_trunk, as it loaded in ours, and the game showed its crash screen;
# the original loads it cleanly. The fixture is the reporter's Old.sav from the issue (cycle 150,
# 2.5 MB; not kept in git): copy it to tests/e2e/fixtures/issue-45-old.sav. No mods are needed.
#
# One Bonbon Tree (SpaceTree) branch in the save sits in a cell its trunk occupies. PlantBranch.Instance's
# constructor, run by KPrefabID's Awake (OnPrefabInit, CreateSMIS) as the save's objects
# activate, logs "PlantBranch.SetOccupyGridSpace already occupied by SpaceTree" and destroys the
# branch: StateMachineController drops its state machines, and Destroy waits for the next
# destruction point. In Unity a behaviour whose Awake destroys its object is not enabled after
# it and never starts; ours enabled it, so KPrefabID started, StartSMIS found the SpaceTreeBranch
# machine created after the drop, and it ran without its PlantBranch. Both players now drop the
# branch at load and count the same branches and trees.
from: issue-45-old
memory_gb: 10
steps:
  - expect_state:
      "count:all:KPrefabID::[*] if .PrefabTag.Name == SpaceTreeBranch": "== original"
      "count:all:KPrefabID::[*] if .PrefabTag.Name == SpaceTree": "== original"
  - run: {seconds: 2}
