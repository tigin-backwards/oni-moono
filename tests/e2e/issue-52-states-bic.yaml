# Issue #52: clicking one point again and again must cycle through what lies there, with Better
# Info Cards at its default options. A logic wire, a logic switch and two debris lie in cell
# (109, 206). The cell is clicked in many states, each click's selection and Better Info Cards'
# card count compared with the original's: no overlay, after Escape, the automation overlay
# opened with a selection held, after a right-click, after the dig tool and back, after
# switching to the power overlay and back, after the pointer clicked elsewhere, and with the
# overlay closed again.
from: early-base
mods: [1960947963]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"LogicControl\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LogicWire\")", method: Build, args: [{"$": "Grid.XYToCell(109, 206)"}, Neutral, null, [Copper], 293.15]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LogicSwitch\")", method: Build, args: [{"$": "Grid.XYToCell(109, 206)"}, Neutral, null, [Copper], 293.15]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"SandStone\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 200, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Dirt\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - driver: {camera.set: {cell: [110, 207], ortho: 8}}
  - run: {seconds: 1, speed: 1}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c1}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c2}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c3}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c4}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - key: {code: "Escape"}
  - run: {seconds: 1, speed: 1}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c5}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c6}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c7}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - key: {code: "Shift+F2"}
  - run: {seconds: 1, speed: 1}
  - expect_state: {"OverlayScreen.Instance.GetMode().ToString()": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c8}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: c9}, "selected:name": "== original", "type:BetterInfoCards.ModifyHits::displayCards.Count": "== original"}
