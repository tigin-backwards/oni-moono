# The Moono Tweaks screen's search box in the game's Simplified Chinese (zh_klei), as
# moono-tweaks-search-en.yaml takes it in English: the rows are in Chinese, a Chinese word keeps
# the rows whose Chinese text has it, and an English word only the rows whose name (in each row's
# launch option) has it, as the rows' English text is not searched. Ours only.
#
# As in English, what a query should show comes from the screen itself (E2eDriver's
# `TweaksScreen::Problems`), so adding, renaming or regrouping tweaks changes nothing here. The
# runner types the Chinese through a key it maps for each character (tests/e2e/README.md, `type`).
from: main-menu
language: zh_klei
tweaks_menu: true
steps:
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/VideoScreen", cond: gone, frames: 600}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {ui: "**/MainMenuButtons/MoonoTweaksButton"}
  - ui_wait: {path: "**/MoonoTweaksScreen", cond: stable}
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField/**/Placeholder": {active: true}
      "**/MoonoTweaksScreen/**/Content/NoMatches": {exists: false}
  # Every row shown, and the rows in Chinese: all but the few a translation may not have caught
  # up with yet (shown in English; TweakTranslationTests lists them).
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Rows": [">= 10", {save_as: rows}]
  - expect_state:
      "type:E2eDriver.TweaksScreen::Shown": "== rows"
      "type:E2eDriver.TweaksScreen::Translated": ">= 0.8 * rows"
  - shot: {name: search-empty, crop: "**/MoonoTweaksScreen/Panel/SearchBar"}
  - ui_dump: {name: search, root: "**/MoonoTweaksScreen/Panel/SearchBar"}
  # 存档 (saving): the rows about saves, by their Chinese text.
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "存档"}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField/**/Text": {text: "~存档"}
      "**/MoonoTweaksScreen/**/Content/NoMatches": {exists: false}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": [">= 2", "< rows"]
  - shot: {name: search-chinese, crop: "**/MoonoTweaksScreen/Panel/SearchBar"}
  # "screen": the rows whose name has it, not those whose English text alone does.
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "screen", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": [">= 1", "< rows"]
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "zzqx", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/Content/NoMatches", cond: stable}
  - expect_ui:
      "**/MoonoTweaksScreen/**/Content/NoMatches/**/Title": {active: true, text: "没有与搜索匹配的调整项。"}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": 0
  - shot: {name: search-none, crop: "**/MoonoTweaksScreen/**/Content/NoMatches"}
  # No clear button (the screen's close button is right above): emptying the field brings
  # every row back.
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/ClearButton": {exists: false}
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/Content/NoMatches", cond: gone}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": "== rows"
