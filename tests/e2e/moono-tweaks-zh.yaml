# The main menu's Moono Tweaks screen in the game's Simplified Chinese (zh_klei): its strings from
# the player's translations/zh.po (docs/TWEAKS.md, "Translating Moono Tweaks"), for a look at how
# the Chinese fits. Ours only (`--player ours`): the original has no Moono Tweaks button.
# moono-tweaks-en.yaml is the same screen in English.
from: main-menu
language: zh_klei
tweaks_menu: true
steps:
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/VideoScreen", cond: gone, frames: 600}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - shot: {name: menu, crop: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons"}
  - click: {ui: "**/MainMenuButtons/MoonoTweaksButton"}
  - ui_wait: {path: "**/MoonoTweaksScreen", cond: stable}
  - ui_dump: {name: screen, root: "**/MoonoTweaksScreen"}
  - shot: screen
  # A row's tooltip (how it works, the launch option), then the choice button's.
  - scroll: {at: "**/MoonoTweaksScreen/**/frame-stats", notches: 0}
  - shot: {name: row-tip, pointer: stay}
  - scroll: {at: "**/MoonoTweaksScreen/**/gpu/**/ManageButton", notches: 0}
  - shot: {name: choice-tip, pointer: stay}
  # The list's end: the gameplay-changing section, its note, a measured gain's tooltip.
  - scroll: {at: "**/MoonoTweaksScreen/**/ListView/Files/Viewport", notches: -60}
  # KScrollRect keeps scrolling for a few frames after the wheel (its inertia): wait for the
  # list to settle before a shot or a hover.
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - shot: {name: end}
  - scroll: {at: "**/MoonoTweaksScreen/**/brain-rate", notches: 0}
  - shot: {name: gameplay-tip, pointer: stay}
  # The Bug fixes section, last: its rows show their tooltips too. (The list's very end: in
  # Chinese, 60 notches stop above it.)
  - scroll: {at: "**/MoonoTweaksScreen/**/ListView/Files/Viewport", notches: -30}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - scroll: {at: "**/MoonoTweaksScreen/**/fix-load-screen-clicks", notches: 0}
  - ui_wait: {path: "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab", cond: text, value: "~--game-tweak fix-load-screen-clicks"}
  - expect_ui:
      "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab": {active: true, text: "/^这是游戏自身代码的错误[\\s\\S]*--game-tweak fix-load-screen-clicks$/"}
  - shot: {name: bugfix-tip, pointer: stay}
  # The measured gain is on a Simulation row, above the end: 17 notches up bring it to the
  # middle of the list in both languages.
  - scroll: {at: "**/MoonoTweaksScreen/**/ListView/Files/Viewport", notches: 17}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/fast-conveyor-paths", cond: stable}
  # The row's centre, on its title here (in English, the gap between its title and effect):
  # the row's tooltip, with its gain and launch option.
  - scroll: {at: "**/MoonoTweaksScreen/**/fast-conveyor-paths", notches: 0}
  - expect_hit: {at: "**/MoonoTweaksScreen/**/fast-conveyor-paths", top: "~/fast-conveyor-paths/TitleAndEffect/Title"}
  - ui_wait: {path: "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab", cond: text, value: "~--game-tweak fast-conveyor-paths"}
  - expect_ui:
      "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab": {active: true, text: "/修改轨道不再卡顿[\\s\\S]*--game-tweak fast-conveyor-paths$/"}
  - shot: {name: gain-tip, pointer: stay}
