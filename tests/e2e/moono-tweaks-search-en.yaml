# The Moono Tweaks screen's search box in English (moono-tweaks-search-zh.yaml: in Chinese): a
# query keeps the rows it matches and the headings of their sections, whatever its case and
# whatever the order of its words; one that matches nothing says so; Escape closes the screen as
# it closes the Supply Closet's inventory while its search has the keyboard; emptying the field
# brings every row back. Ours only (`--player ours`).
#
# What a query should show comes from the screen itself, not from a list of tweaks here:
# E2eDriver's `TweaksScreen::Problems` (tools/E2eDriver/README.md, "Moono Tweaks screen") checks
# each row against the field's text as the game's searches match (the row's name, title,
# one-liner, tooltip and choices), each heading against its rows and the "no matches" line
# against them all. Adding, renaming or regrouping tweaks changes nothing here. The shots and the
# dump keep to the search bar and the "no matches" line, which do not change with the catalog.
from: main-menu
tweaks_menu: true
steps:
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/VideoScreen", cond: gone, frames: 600}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {ui: "**/MainMenuButtons/MoonoTweaksButton"}
  - ui_wait: {path: "**/MoonoTweaksScreen", cond: stable}
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField/**/Placeholder": {active: true, text: "Search"}
      "**/MoonoTweaksScreen/**/Content/NoMatches": {exists: false}
  # Every row shown before a search.
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Rows": [">= 10", {save_as: rows}]
  - expect_state: {"type:E2eDriver.TweaksScreen::Shown": "== rows"}
  - shot: {name: search-empty, crop: "**/MoonoTweaksScreen/Panel/SearchBar"}
  - ui_dump: {name: search, root: "**/MoonoTweaksScreen/Panel/SearchBar"}
  # A word many rows have (the loading screen, the Load screen, the rows on screen): some rows
  # and their headings, not all.
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "screen"}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField/**/Text": {text: "~screen"}
      "**/MoonoTweaksScreen/**/Content/NoMatches": {exists: false}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": [">= 2", "< rows", {save_as: screen}]
  - shot: {name: search-screen, crop: "**/MoonoTweaksScreen/Panel/SearchBar"}
  # The same word in capitals: the same rows.
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "SCREEN", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": "== screen"
  # Two words in another order than the rows have them: the rows with both.
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "screen load", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": [">= 1", "<= screen"]
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "zzqx", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/Content/NoMatches", cond: stable}
  - expect_ui:
      "**/MoonoTweaksScreen/**/Content/NoMatches/**/Title": {active: true, text: "No tweaks match the search."}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": 0
  - shot: {name: search-none, crop: "**/MoonoTweaksScreen/**/Content/NoMatches"}
  # No clear button (the screen's close button is right above): emptying the field brings
  # every row back.
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/ClearButton": {exists: false}
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "", clear: true}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/Content/NoMatches", cond: gone}
  - expect_state:
      "type:E2eDriver.TweaksScreen::Problems": ok
      "type:E2eDriver.TweaksScreen::Shown": "== rows"
  # Typing again, then Escape: the field takes the camera's keys as text, and the screen
  # closes, as the Supply Closet's inventory does with its search field focused (measured in the
  # original, U60 761211).
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "wasd"}
  - expect_ui:
      "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField/**/Text": {text: "~wasd"}
  - expect_state: {"type:E2eDriver.TweaksScreen::Problems": ok}
  - key: {code: Escape}
  - ui_wait: {path: "**/MoonoTweaksScreen", cond: gone, frames: 600}
