# SystemInfo on Direct3D 11 (docs/research/d3d11-plan.md, done criterion 2, M7): every graphics value
# Moono's SystemInfo has, every TextureFormat's and RenderTextureFormat's support and the default
# graphics formats, read in a colony by each player and compared with the original's (its own
# Direct3D 11 on the same GPU; ours with E2E_PLAYER_ARGS='--renderer d3d11', WIN_RENDERER=d3d11).
# Values that differ are listed in the plan's M7 section with why. Left out, as ours answers
# false on every device where the original's Direct3D 11 says true: supportsComputeShaders (no
# device of ours dispatches compute) and supportsSparseTextures (none makes tiled resources).
from: early-base
steps:
  - expect_state:
      "UnityEngine.SystemInfo.graphicsDeviceType": "== original"
      "UnityEngine.SystemInfo.graphicsDeviceName": "== original"
      "UnityEngine.SystemInfo.graphicsDeviceVendor": "== original"
