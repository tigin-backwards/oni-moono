# The gas-boundary fixture: four gases meeting in a sealed granite box near the printing pod.
#
# setup fills a box 18 cells wide and 6 tall (cells 105-122, 213-218, a granite frame around
# it) with oxygen, carbon dioxide, chlorine and hydrogen, 2 kg a cell, in that order from the
# left. The game runs 4 seconds, so the gases mix at their boundaries, and saves. --bless
# copies the save into fixtures/ for gas-view.yaml.
from: landing
