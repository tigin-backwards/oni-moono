# Issue #48: with Fast Track, clicking one point of a stack again and again stopped cycling
# through it after about 40 clicks and kept selecting one object. Fast Track (a GitHub build: install
# 0.18.6 as $ONI_WS/9000000001 to run this spec) replaces the body of
# InterfaceTool.GetObjectUnderCursor<KSelectable> with `return null` and calls it from its
# SelectTool.OnLeftClickDown prefix, then cycles with its own GetNextSelectable. Once the shared
# code of GetObjectUnderCursor<__Canon> tiered up, MonoMod did not move its detour onto the new
# code, which ran the original body: given no previous selection it returns the first object
# under the cursor, every click. The host now moves the detour along (ARCHITECTURE D13).
#
# The issue-48-stack2 fixture (issue-48-pipes, issue-48-stack2): seven foods, a wire, a gas pipe and
# a liquid pipe in cell (109, 206). It is clicked 60 times at one point; each click selects another
# object than the one before. Fast Track orders the stack by a struct hash, which differs between
# processes in the original too, so the objects are not compared with the original's.
from: issue-48-stack2
mods: [9000000001]
steps:
  - driver: {camera.set: {cell: [110, 207], ortho: 8}}
  - run: {seconds: 1, speed: 1}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: s0}}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": ["!= s0", {save_as: s1}]}
  - click_world: {pos: [109.5, 206.2]}
