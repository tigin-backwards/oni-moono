# Moono's Workshop item in the original game (docs/INSTALL-MODES.md, "The loader mod"), run with
# --player original: a made-up item (`moono_item`) as a Local mod, its loader mod enabled.
# At the main menu the loader asks once whether to play with Moono, in the game's info dialog:
# three numbered steps, the launch-option line in a box, and Not now and Copy launch option.
# Not now leaves the game at its main menu. The item's row in the Mods screen has a Play with
# Moono button that shows the dialog again; Copy launch option installs the item's player into
# the profile's moono-install/versioned (ONI_MOONO_INSTALL_ROOT), the entry point and the state
# Moono reads, puts the line on the clipboard and says so, and the dialog stays open until Not
# now.
from: main-menu
moono_item: true
expect_log:
  - '\[MoonoLoader\] asked whether to play with Moono'
  - '\[MoonoLoader\] Moono 2026\.11\.10\.01-u60 installed in .*/moono-install/versioned; launch option copied: ".*/moono-install/versioned/OniMoono" -- %command%'
steps:
  # The intro video of a first start plays over the main menu and its dialog.
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/VideoScreen", cond: gone, frames: 600}
  - ui_wait: {path: "**/MoonoDialog", cond: stable, frames: 600}
  - expect_ui:
      "**/MoonoDialog/**/Header/Label": {text: "Play with Moono?"}
      "**/MoonoDialog/**/Step1": {text: "1. Click Copy launch option. This installs Moono and copies:"}
      "**/MoonoDialog/**/LaunchOption/**/Text": {text: "~OniMoono\" -- %command%"}
      "**/MoonoDialog/**/Step3": {text: "3. Quit the game and press Play."}
      "**/MoonoDialog/**/Hint": {text: "To stop seeing this, disable the Moono mod."}
      "**/MoonoDialog/**/LeftButton_Prefab/Text": {text: "Not now"}
      "**/MoonoDialog/**/RightButton_Prefab/Text": {text: "Copy launch option"}
  - ui_dump: {name: dialog, root: "**/MoonoDialog"}
  - shot: {name: dialog}
  - click: {text: "Not now", under: "**/MoonoDialog"}
  - ui_wait: {path: "**/MoonoDialog", cond: gone, frames: 600}
  - expect_state:
      "file:moono-install": missing
  - click: {text: "MODS", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModsScreen/Panel", cond: stable}
  - expect_ui:
      "**/ModsScreen/Panel/ListView/Files/Viewport/Content/Moono/**/MoonoButton": {active: true, interactable: true}
  - ui_dump: {name: row, root: "**/ModsScreen/Panel/ListView/Files/Viewport/Content/Moono"}
  - shot: {name: mods}
  - click: {ui: "**/ModsScreen/**/Content/Moono/**/MoonoButton"}
  - ui_wait: {path: "**/MoonoDialog", cond: stable, frames: 600}
  - click: {text: "Copy launch option", under: "**/MoonoDialog"}
  - expect_ui:
      "**/MoonoDialog/**/RightButton_Prefab/Text": {text: "Copied ✓"}
      "**/MoonoDialog/**/Step1": {text: "1. Moono installed. Launch option copied."}
      "**/MoonoDialog/Layout": {active: true}
  - shot: {name: copied}
  - expect_state:
      "file:moono-install/versioned/player/2026.11.10.01-u60/OniMoono": exists
      "file:moono-install/versioned/player/2026.11.10.01-u60/packages/UnityEngine.UI.dll": exists
      "file:moono-install/versioned/player/2026.11.10.01-u60/moono.json": exists
      "file:moono-install/versioned/player/2026.11.10.01-u60/SHA256SUMS": exists
      "file:moono-install/versioned/OniMoono": exists
      "file:moono-install/versioned/state/current": exists
      "file:moono-install/versioned/state/source": exists
      "type:MoonoLoader.MoonoDialog::LastCopied": {contains: "/moono-install/versioned/OniMoono\" -- %command%"}
  - click: {text: "Not now", under: "**/MoonoDialog"}
  - ui_wait: {path: "**/MoonoDialog", cond: gone, frames: 600}
  - expect_ui:
      "**/ModsScreen/Panel": {active: true}
