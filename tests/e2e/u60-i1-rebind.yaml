# U60 QA spec I1 (docs/research/u60-qa-spec.md): mouse buttons 3 to 6 as bindings. In a
# colony, Options > Game > Controls: Dig (the fifth entry) is rebound to the back side button
# (X button 8), its label dumped, then the button is pressed over the world: the Dig tool must
# be active as in the original.
from: early-base
steps:
  - key: {code: Escape, until: "**/PauseScreen/LayoutContent/ButtonContent"}
  - click: {ui: "**/PauseScreen/LayoutContent/ButtonContent/OptionsButton"}
  - ui_wait: {path: "**/OptionsMenu/CenterContent/Content/Buttons/GameButton", cond: stable}
  - click: {ui: "**/OptionsMenu/CenterContent/Content/Buttons/GameButton"}
  - ui_wait: {path: "**/GameOptionsScreen", cond: stable}
  - click: {ui: "**/GameOptionsScreen/**/ControlsButton"}
  - ui_wait: {path: "**/InputBindingsScreen/**/Entry/KeyButton", cond: stable, frames: 600}
  - ui_dump: {name: before, root: "**/InputBindingsScreen/**/Group"}
  # Rebinding: the entry's key button, then the side button (the screen polls Input.GetKey).
  - click: {ui: "**/InputBindingsScreen/**/Entry/KeyButton", index: 4}
  - click: {at: [1100, 650], button: 8}
  - ui_wait: {path: "**/InputBindingsScreen/**/Entry/KeyButton", cond: stable}
  - ui_dump: {name: back, root: "**/InputBindingsScreen/**/Group"}
  - click: {ui: "**/InputBindingsScreen/Content/Buttons/DoneButton"}
  - key: {code: Escape, until: "**/PauseScreen", cond: gone}
  # The side button over the world picks the Dig tool.
  - driver: {camera.set: {pos: [110.5, 208.5], ortho: 20}}
  - click_world: {cell: [110, 208], button: 8}
  - expect_state:
      "PlayerController.Instance.ActiveTool.name": "== original"
