# U60 QA spec G4 (docs/research/u60-qa-spec.md, "Game logic"): Merpip; Pips eating Caviar; Snow Globe keepsake; Tublia care package.
# Game code only, no new engine surface: the values the changed code sets up, read in both
# players and compared with the original's; then the colony runs a game minute.
from: early-base
steps:
  - expect_state:
      "Assets.GetPrefab(\"SquirrelAquatic\").name": "== original"
      "Assets.GetPrefab(\"SquirrelAquatic\").GetComponent<KPrefabID>().Tags.Count": "== original"
      "Assets.GetPrefab(\"SquirrelAquaticBaby\").name": "== original"
      "Assets.GetPrefab(\"Squirrel\").GetComponent<KPrefabID>().Tags.Count": "== original"
  - run: {seconds: 60}
  - expect_state:
      "Components.LiveMinionIdentities.Count": "== original"
