# The sky behind a world, as TerrainBG.LateUpdate draws it (U60 764025): the northern lights of a
# world with that trait (Klei/NorthernLights: WorldContainer.northernlights above 0, the Frosty
# Planet pack's Ceres worlds) and the Demolior's fragments once the impactor is defeated on a world
# that allows them (Klei/LargeImpactorFragments: largeImpactorFragments ALLOWED, 1, and
# ColonyAchievementTracker.largeImpactorState Defeated). No fixture has either, so setup sets the
# three values the game would and reveals the sky above the surface (the world is 240 by 380
# cells), where nothing hides the background planes. Klei/NorthernLights' vertex program passes a
# clip-space quad through with no projection, so the lights' way up follows the renderer's
# render-texture convention: the original draws them mirrored top to bottom on GLCore against
# Direct3D 11. Ours on Vulkan matches the original on Direct3D 11, ours on OpenGL its GLCore
# (ARCHITECTURE.md, Vulkan conventions). Compared between players and renderers (shots only, no
# reference).
from: prehistoric1
setup:
  - driver: {setup.set: {target: "ClusterManager.Instance.activeWorld", member: largeImpactorFragments, value: 1}}
  - driver: {setup.set: {target: "ClusterManager.Instance.activeWorld", member: northernlights, value: 1}}
  - driver: {setup.set: {target: "SaveGame.Instance.ColonyAchievementTracker", member: largeImpactorState, value: Defeated}}
  - driver: {setup.call: {type: GridVisibility, method: Reveal, args: [120, 350, 60, 60.0]}}
steps:
  - world_shot: {name: sky, ortho: 30, at: [120, 345]}
