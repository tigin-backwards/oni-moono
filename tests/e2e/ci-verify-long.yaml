# CI's nightly verify run (docs/DEVELOPMENT.md, "Game tests in CI"), headless on the stripped
# game: a mid-game Spaced Out colony (about 50 Duplicants) for ten game minutes at speed 3 with
# every game tweak and the verify modes that report without a GL device. scripts/ci-game-tests.sh
# then reads the log with `qa-tools.py verify`: every check that
# ci/game-tests/verify/ci-verify-long.txt names reports, with zero wrong answers.
# docs/DEVELOPMENT.md, "Game tests in CI", lists the modes CI does not cover.
from: 2minnow
game_tweaks: [all]
env:
  ONI_TWEAK_VERIFY: "1"
  ONI_VERIFY_FETCH_BY_CELL: "1"
  ONI_VERIFY_CANVAS_CULL: "1"
  ONI_VERIFY_CANVAS_PRODUCTS: "1"
  ONI_VERIFY_COMPONENT_LAYOUTS: "1"
  ONI_VERIFY_RAW_LOADS: "1"
steps:
  - run: {seconds: 600}
