steps:
  # The save predates two rounds of changes, and the game shows a dialog for each, the later
  # one on top.
  - expect_ui: {"**/SpriteListDialog": {count: 2}}
  - click: {ui: "**/SpriteListDialog/**/ConfigurableButton", index: 1}
  - expect_ui: {"**/SpriteListDialog": {count: 1}}
  - click: {ui: "**/SpriteListDialog/**/ConfigurableButton"}
  - ui_wait: {path: "**/SpriteListDialog", cond: gone, frames: 120}
  - call: {tool: navigation_control, args: {action: set_active_world, worldId: 0}}
  - expect_state:
      "cells:67,247..67,247::Grid.Temperature.get_Item({cell})": 1678.0
      "cells:83,247..83,247::Grid.Temperature.get_Item({cell})": 300.0
      "CellSelectionObject.IsExposedToSpace(181859)": true
      "CellSelectionObject.IsExposedToSpace(181875)": true
      "CellSelectionObject.IsExposedToSpace(11691)": false
  - key: {code: "F3"}
  - expect_state: {"OverlayScreen.Instance.GetMode().ToString()": "== original"}
  - world_shot: {name: space, ortho: 10, at: [76, 248]}
  - call: {tool: navigation_control, args: {action: set_active_world, worldId: 10}}
  - world_shot: {name: cabin, ortho: 6, at: [652, 16]}
