# Issue #71: the temperature overlay over gas in cells exposed to space, such as a rocket's
# exhaust (1400 C carbon dioxide) beside its launch pad.
#
# In absolute temperature mode the overlay compositor (Klei/PostFX/SimDebugViewCompositor) takes
# the coloured overlay buffer _MRT2 where it is not black, else the cell's temperature colour.
# Where a cell is exposed to space the back wall discards and only the stars are drawn, and
# Klei/Stars declares an output for its first target alone while _MRT2 is bound. OpenGL leaves a
# draw buffer the shader writes no value for undefined (4.6 core, 17.4.1), and NVIDIA's Windows
# driver wrote the stars' colour there: every space cell showed the stars instead of its
# temperature, the exhaust's included. Ours masks such draw buffers (GlStateCache.Outputs).
# Vulkan requires such attachments to be left unmodified, and ours on Vulkan showed the overlay.
#
# Setup puts 0.1 kg of carbon dioxide in each of 16 space cells at 1678 K (left of the rocket)
# and 16 at 300 K (right of it), and 4 cells at 1678 K in the rocket's cabin (enclosed). Mesa's
# drivers on the lanes kept _MRT2 before the fix too, so the shots compare the colours with the
# original rather than catching the leak itself.
from: rockets-so
setup:
  - driver: {setup.call: {type: SimMessages, method: AddRemoveSubstance, args: [181122, CarbonDioxide, null, 0.1, 1678.0, 255, 0]}}
