# The main menu's Moono Tweaks screen in English, as moono-tweaks-zh.yaml takes it in Chinese.
# Ours only (`--player ours`).
from: main-menu
tweaks_menu: true
steps:
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/VideoScreen", cond: gone, frames: 600}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - shot: {name: menu, crop: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons"}
  - click: {ui: "**/MainMenuButtons/MoonoTweaksButton"}
  - ui_wait: {path: "**/MoonoTweaksScreen", cond: stable}
  - ui_dump: {name: screen, root: "**/MoonoTweaksScreen"}
  - shot: screen
  - scroll: {at: "**/MoonoTweaksScreen/**/frame-stats", notches: 0}
  - shot: {name: row-tip, pointer: stay}
  - scroll: {at: "**/MoonoTweaksScreen/**/gpu/**/ManageButton", notches: 0}
  - shot: {name: choice-tip, pointer: stay}
  - scroll: {at: "**/MoonoTweaksScreen/**/ListView/Files/Viewport", notches: -100}
  # KScrollRect keeps scrolling for a few frames after the wheel (its inertia): wait for the
  # list to settle before a shot or a hover.
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - shot: {name: end}
  # The gameplay-changing section's last row sits just above the Bug fixes section, which can
  # fill the list's end: two notches back up bring it out from under the search box.
  - scroll: {at: "**/MoonoTweaksScreen/**/ListView/Files/Viewport", notches: 2}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - scroll: {at: "**/MoonoTweaksScreen/**/brain-rate", notches: 0}
  - shot: {name: gameplay-tip, pointer: stay}
  # The Bug fixes section, last: its rows show their tooltips too.
  - scroll: {at: "**/MoonoTweaksScreen/**/brain-rate", notches: -30}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/ListView/Files/Viewport/Content", cond: stable}
  - scroll: {at: "**/MoonoTweaksScreen/**/fix-load-screen-clicks", notches: 0}
  - ui_wait: {path: "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab", cond: text, value: "~--game-tweak fix-load-screen-clicks"}
  - expect_ui:
      "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab": {active: true, text: "/^A bug in the game.s own code[\\s\\S]*--game-tweak fix-load-screen-clicks$/"}
  - shot: {name: bugfix-tip, pointer: stay}
  # The measured gain is on a Graphics row: the search box brings it to the top of the list
  # (wheel notches travel further at a lower frame rate).
  - type: {ui: "**/MoonoTweaksScreen/Panel/SearchBar/Search/FilterInputField", text: "fast-overlays"}
  - ui_wait: {path: "**/MoonoTweaksScreen/**/fast-overlays", cond: stable}
  # The row's centre, in the gap between its title and effect: the row's background shows
  # the row's tooltip too, with its gain and launch option.
  - scroll: {at: "**/MoonoTweaksScreen/**/fast-overlays", notches: 0}
  - expect_hit: {at: "**/MoonoTweaksScreen/**/fast-overlays", top: "~/fast-overlays/BG"}
  - ui_wait: {path: "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab", cond: text, value: "~--game-tweak fast-overlays"}
  - expect_ui:
      "**/ToolTipScreen/**/MultitooltipContainer/LabelPrefab": {active: true, text: "/Temperature overlay ~40% cheaper[\\s\\S]*--game-tweak fast-overlays$/"}
  - shot: {name: gain-tip, pointer: stay}
