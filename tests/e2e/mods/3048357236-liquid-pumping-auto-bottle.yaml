# Liquid Pumping Station (Pitcher Pump) Auto Bottle Toggle (3048357236), class S (a user menu
# button on a vanilla building).
#
# What it does: a Pitcher Pump (LiquidPumpingStation) gets a user menu button, "Disallow Auto
# Bottle" / "Allow Auto Bottle": disallowed, the bottles it fills are tagged so Bottle
# Emptiers' fetches (patched to forbid that tag) do not take them; the setting is saved and
# copied with the building's settings.
# How a player reaches it: selecting a Pitcher Pump; its user menu.
# What changes: pumped liquid can be kept from auto-bottling.
#
# setup places a Pitcher Pump in the corridor west of the printing pod (118,207): its user
# menu (dumped) has Disallow Auto Bottle, whose click forbids it and turns the button to Allow.
from: early-base
mods: [3048357236]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidPumpingStation\")", method: Build, args: [131770, Neutral, null, [SandStone], 293.15, DEFAULT_FACADE]}}
steps:
  - run: {seconds: 2}
  - expect: {buildings: {LiquidPumpingStation: 1}}
  - driver: {camera.set: {cell: [118, 208], ortho: 8}}
  - click_world: {cell: [118, 207], select: LiquidPumpingStation}
  - ui_wait: {path: "**/DetailsScreen/UserMenuButtons/UserMenuScreen/Buttons", cond: stable}
  - ui_dump: {name: user-menu, root: "**/DetailsScreen/UserMenuButtons/UserMenuScreen/Buttons"}
  - click: {ui: "**/UserMenuScreen/Buttons/Disallow Auto BottleButton"}
  - ui_wait: {path: "**/UserMenuScreen/Buttons/Allow Auto BottleButton", cond: stable}
