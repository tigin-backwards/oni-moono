# Print AS1R0 - Robot Race Mod (3683237086), class X (content for Dupery).
#
# What it does: no code. With Dupery (here Dupery Fixed, 3172734005; its description requires
# Dupery), its personalities.json adds a printable Duplicant personality, Astro
# (Astro: male bionic, Stress Shocker stress reaction, Data Rainer joy trait), with its hair from the mod's anim folder.
# How a player reaches it: Duplicants printed or picked for a new colony; the Duplicant's
# Personality tab.
# What changes: another personality in the pool.
#
# Dupery imports the personality into the game's Personalities and loads its accessories.
from: early-base
mods: [3172734005, 3683237086]
require_log: ['\[Dupery\]: accessory hair_astro successfully loaded']
steps:
  - expect_state:
      "Db.Get().Personalities.TryGet(\"ASTRO\")": exists
      "Db.Get().Personalities.TryGet(\"ASTRO\").Disabled": false
      "Db.Get().Accessories.TryGet(\"hair_astro\")": exists
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 10}
  - expect: {duplicants: 3}
