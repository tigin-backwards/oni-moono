# 让壁虎再次伟大 Good Old Drecko (3760439827), class P.
#
# What it does: a miserable Drecko's (and Glossy Drecko's) scales keep growing: a postfix on
# HappinessMonitor.InitializeStates removes the scale growth modifier from its miserable
# effects, tame and wild, and rewrites their tooltips (Chinese and English).
# How a player reaches it: ranching Dreckos that are miserable.
# What changes: scales still grow on unhappy Dreckos.
#
# setup spawns a Drecko in the dug-out corridor west of the printing pod. Its happiness
# monitor's miserable effects carry no scale growth penalty (the sum of their ScaleGrowthDelta
# modifiers is 0), and the colony runs on.
from: early-base
mods: [3760439827]
require_log: ['\[GoodOldDrecko\] loaded']
setup:
  - driver: {setup.call: {type: Scenario, method: SpawnPrefab, args: [{"$": "Grid.XYToCell(113, 206)"}, 0, 0, Drecko, Creatures]}}
  - driver: {setup.call: {target: "last:", method: SetActive, args: [true]}}
steps:
  - run: {seconds: 2}
  - expect_state:
      "last:GetComponent<KPrefabID>.PrefabTag.Name": Drecko
      "count:last:GetComponent<StateMachineController>.GetSMI(\"HappinessMonitor+Instance\").sm.miserableTameEffect.SelfModifiers[*] if .AttributeId == ScaleGrowthDelta": 0
      "count:last:GetComponent<StateMachineController>.GetSMI(\"HappinessMonitor+Instance\").sm.miserableWildEffect.SelfModifiers[*] if .AttributeId == ScaleGrowthDelta": 0
  - run: {seconds: 60}
  - expect: {duplicants: 3}
