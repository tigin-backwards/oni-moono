# 大锅炉(the Cauldron) (3088549527), class B.
#
# What it does: adds a big boiler, the Cauldron (Daguolu), to the Utilities menu, researched with
# Renewable Energy: 2000 kg of storage that it heats.
# How a player reaches it: the build menu (Utilities), after the research.
# What changes: a boiler to make steam with.
#
# setup grants Renewable Energy and builds the Cauldron in the dug-out corridor west of the
# printing pod. It shows in the Utilities menu; selected, its details screen is dumped.
from: early-base
mods: [3088549527]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"RenewableEnergy\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"Daguolu\")", method: Build, args: [{"$": "Grid.XYToCell(111, 206)"}, Neutral, null, [Steel], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"RenewableEnergy\").unlockedItemIDs": {contains: Daguolu}
  - run: {seconds: 2}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Daguolu Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/Daguolu Group*": {active: true}
  - key: {code: Escape}
  - driver: {camera.set: {cell: [111, 207], ortho: 8}}
  - click_world: {cell: [111, 206], select: Daguolu}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - ui_dump: {name: title, root: "**/DetailsScreen/TitleBar"}
