# Print Alien! (Girl) - Mutant Race Mod (2681795804), class X (no code: personalities.json, animations and strings).
#
# What it does: adds a printable Duplicant personality, Moona (an AlienMinion model, with its own head and mouth), with its own hair
# animation, read by the game from the mod's personalities.json.
# How a player reaches it: the Printing Pod's and new game's Duplicant cards.
# What changes: Moona can be printed.
#
# The game's personalities include Moona, printable, as in the original.
from: early-base
mods: [2681795804]
steps:
  - expect_state:
      "Db.Get().Personalities.Get(\"MOONA\").Name": Moona
      "Db.Get().Personalities.Get(\"MOONA\").Disabled": false
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 30}
