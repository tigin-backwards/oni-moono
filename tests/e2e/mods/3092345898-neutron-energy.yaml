# neutron-energy (3092345898), class P (a load spec).
#
# What it does: see the mod's page; its decompiled code has Harmony patches on Db.Initialize,
# GeneratedBuildings.LoadGeneratedBuildings, ObjectDispenserConfig.DoPostConfigureComplete,
# SolidConduitInboxConfig.DoPostConfigureComplete,
# StorageLockerConfig.ConfigureBuildingTemplate,
# StorageLockerSmartConfig.DoPostConfigureComplete.
# How a player reaches it: through its own screens or buildings, which this spec does not
# drive yet.
# What changes: what its patches change.
#
# A load spec: the colony loads with the mod, its patched methods counted as in the original,
# and two minutes of play pass with the Duplicants alive.
from: early-base
mods: [3092345898]
steps:
  - expect_state:
      "sum:Global.Instance.modManager.mods[*].loaded_mod_data.patched_methods.Count if .label.id == 3092345898": "== original"
      "count:Global.Instance.modManager.mods[*] if .label.id == 3092345898 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 120}
  - expect: {duplicants: ">= 1"}
