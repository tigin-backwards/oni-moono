# Hide Pixel Pack Warning Icons (隐藏像素屏警告图标) (3784376690), class V.
#
# What it does: a prefix on KSelectable.AddStatusItem keeps the Pixel Pack's disabled and
# unconnected-wire status items off it, so their icons do not show over the building.
# How a player reaches it: Pixel Packs.
# What changes: Pixel Pack walls without warning icons.
#
# The mod loads, as its log says, and the colony plays for 30 s.
from: early-base
mods: [3784376690]
require_log: ['\[PixelPackNoIcon\] Mod loaded - final icon filter']
steps:
  - run: {seconds: 30}
  - expect: {duplicants: 3}
