# Light Printing Pod Refresh / 轻量打印舱刷新 (3792025973), class P (a load spec).
#
# What it does: see the mod's page; its decompiled code has Harmony patches on
# CarePackageContainer.GenerateCharacter, CarePackageContainer.Initialize,
# CarePackageContainer.Reshuffle, CharacterContainer.GenerateCharacter,
# CharacterContainer.Initialize, CharacterContainer.OnShow, CharacterContainer.Reshuffle,
# ImmigrantScreen.OnRejectAll and 3 more.
# How a player reaches it: through its own screens or buildings, which this spec does not
# drive yet.
# What changes: what its patches change.
#
# A load spec: the colony loads with the mod, its patched methods counted as in the original,
# and two minutes of play pass with the Duplicants alive.
from: early-base
mods: [3792025973]
steps:
  - expect_state:
      "sum:Global.Instance.modManager.mods[*].loaded_mod_data.patched_methods.Count if .label.id == 3792025973": "== original"
      "count:Global.Instance.modManager.mods[*] if .label.id == 3792025973 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 120}
  - expect: {duplicants: ">= 1"}
