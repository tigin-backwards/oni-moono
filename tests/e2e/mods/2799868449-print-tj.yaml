# Print TJ (2799868449), class X (no code: personalities.json, animations and strings).
#
# What it does: adds a printable Duplicant personality, TJ, with its own hair
# animation, read by the game from the mod's personalities.json.
# How a player reaches it: the Printing Pod's and new game's Duplicant cards.
# What changes: TJ can be printed.
#
# The game's personalities include TJ, printable, as in the original.
from: early-base
mods: [2799868449]
steps:
  - expect_state:
      "Db.Get().Personalities.Get(\"TJ\").Name": TJ
      "Db.Get().Personalities.Get(\"TJ\").Disabled": false
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 30}
