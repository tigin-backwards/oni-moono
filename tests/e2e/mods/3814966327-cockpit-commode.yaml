# Cockpit Commode (3814966327), class B.
#
# What it does: adds the Cockpit Commode (CockpitCommode, in the Rocketry menu, researched with
# Space Program): a rocket pilot's seat that is also a toilet, so a solo pilot never leaves the
# console mid-flight.
# How a player reaches it: the build menu (Rocketry), after the research.
# What changes: one module serves both needs.
#
# setup grants the research. The building is listed in the Rocketry menu and its card opens
# from there (dumped).
from: early-base
mods: [3814966327]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"SpaceProgram\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"SpaceProgram\").unlockedItemIDs": {contains: CockpitCommode}
      "Assets.GetBuildingDef(\"CockpitCommode\")": exists
  - run: {seconds: 5}
  - click: {ui: "**/PlanScreen/Toggle:Rocketry"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/CockpitCommode Group*", cond: stable, stable: 120, frames: 600}
  - click: {ui: "**/BuildingGroups/**/Grid/CockpitCommode Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - ui_dump: {name: card, root: "**/ProductInfoScreen"}
  - key: {code: Escape}
  - key: {code: Escape}
