# Print Blug (2799871913), class X (no code: personalities.json, animations and strings).
#
# What it does: adds a printable Duplicant personality, Blug, with its own hair
# animation, read by the game from the mod's personalities.json.
# How a player reaches it: the Printing Pod's and new game's Duplicant cards.
# What changes: Blug can be printed.
#
# The game's personalities include Blug, printable, as in the original.
from: early-base
mods: [2799871913]
steps:
  - expect_state:
      "Db.Get().Personalities.Get(\"BLUG\").Name": Blug
      "Db.Get().Personalities.Get(\"BLUG\").Disabled": false
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 30}
