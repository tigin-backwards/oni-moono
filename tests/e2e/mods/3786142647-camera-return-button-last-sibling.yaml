# Camera Return Button Last Sibling (3786142647), class S.
#
# What it does: postfixes on NotificationScreen.OnPrefabInit and
# NotificationScreen_TemporaryActions.OnPrefabInit move the temporary actions' row (the camera
# return button) to the end of the notification list, below every notification.
# How a player reaches it: the notification list at the left of the screen.
# What changes: the camera return button stays at the bottom.
#
# The temporary actions' row is the last child of its parent, and the notification list is
# dumped.
from: early-base
mods: [3786142647]
steps:
  - expect_state:
      "NotificationScreen_TemporaryActions.Instance.originalRow.transform.parent.parent.childCount": {save_as: n}
  - expect_state:
      "NotificationScreen_TemporaryActions.Instance.originalRow.transform.parent.GetSiblingIndex()": "== n - 1"
  - run: {seconds: 10}
  - expect: {duplicants: 3}
