# FireKylinGun Skin 火麒麟 (3757214429), class V (anims).
#
# What it does: its anim folder replaces the game's excavator_kanim (KMod loads a mod's anims over
# the game's of the same name), so a Duplicant's dig gun look like the Fire Kylin (火麒麟); its code only
# logs that it loaded.
# How a player reaches it: Duplicants digging.
# What changes: the dig gun's look.
#
# The game's dig gun anims are the mod's (their textures' sizes), and a Duplicant digs out a
# floor tile of the corridor west of the printing pod with it.
from: early-base
mods: [3757214429]
require_log: ['\[FireKylinGun\] 火麒麟挖掘枪皮肤已加载！']
steps:
  - expect_state:
      "Assets.GetAnim(\"excavator_kanim\").textureList[0].width": 256
  - dig: [112, 205, 112, 205]
  - run: {seconds: 600, until: {pending_digs: 0}}
  - expect: {pending_digs: 0}
