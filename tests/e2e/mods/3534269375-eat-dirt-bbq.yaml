# Make Dirt, Sand, Rock, Clay,... To BarBaQue (Eat Dirt Mod) (3534269375), class P.
#
# What it does: meant to add Electric Grill recipes turning 10 kg of sand, rock, dirt, clay and
# other minerals into barbeque (a postfix on CookingStationConfig.ConfigureBuildingTemplate).
# Its patches are applied from MakeMeatMod.Load, a static method KMod never calls (it calls
# OnLoad), and it has no UserMod2, so in both players they never apply.
# How a player reaches it: an Electric Grill's recipe list.
# What changes: nothing, in this build of the mod.
#
# The Electric Grill has the game's recipes only, as in the original: no barbeque from dirt.
from: early-base
mods: [3534269375]
steps:
  - expect_state:
      "count:ComplexRecipeManager.Get().recipes[*] if .id.StartsWith(\"CookingStation_\") == true": "== original"
      "count:ComplexRecipeManager.Get().recipes[*] if .id.StartsWith(\"CookingStation_I_Dirt\") == true": 0
  - run: {seconds: 30}
