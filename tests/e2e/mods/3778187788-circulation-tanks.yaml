# Circulation Tanks (3778187788), class B.
#
# What it does: recoloured copies of the Liquid and Gas Reservoir with two inputs and two outputs
# each (FluidCirculationTank, 2x3, 5000 kg; GasCirculationTank, 5x3, 1000 kg), in the Base menu
# after the reservoirs, with the game's capacity, cost and research.
# How a player reaches it: the build menu (Base), after the reservoirs' research.
# What changes: reservoirs on two loops at once.
#
# setup builds a liquid circulation tank in the dug-out corridor west of the printing pod. Both
# tanks are in the game's definitions (with the reservoirs' capacities); selected, its details
# screen is dumped.
from: early-base
mods: [3778187788]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"ImprovedLiquidPiping\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"HVAC\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"FluidCirculationTank\")", method: Build, args: [{"$": "Grid.XYToCell(112, 206)"}, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"FluidCirculationTank\").BuildingComplete.GetComponent<Storage>.capacityKg": 5000
      "Assets.GetBuildingDef(\"GasCirculationTank\").BuildingComplete.GetComponent<Storage>.capacityKg": 1000
  - run: {seconds: 2}
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/FluidCirculationTank Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/FluidCirculationTank Group*": {active: true}
      "**/BuildingGroups/**/Grid/GasCirculationTank Group*": {active: true}
  - key: {code: Escape}
  - driver: {camera.set: {cell: [112, 207], ortho: 8}}
  - click_world: {cell: [112, 206], select: FluidCirculationTank}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - ui_dump: {name: title, root: "**/DetailsScreen/TitleBar"}
