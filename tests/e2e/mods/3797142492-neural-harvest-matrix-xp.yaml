# Neural Harvest Matrix (Duplicant Harvesting Power Source - XP Version) (3797142492), class B, M.
#
# What it does: the XP version of the Neural Harvest Matrix (MattsMatrixMachine, 3x3, in the
# Power menu, researched with Renewable Energy): a Visco-Gel generator powered by an integrated
# Duplicant, whose stored copy keeps its experience (MinionStorage.CopyMinion,
# MinionStartingStats.ApplyExperience and StoredMinionConfig patches); dismantling it releases
# the corpse.
# How a player reaches it: the build menu (Power), after the research.
# What changes: Duplicants as a power source, their experience kept.
#
# setup grants the research. The building is listed in the Power menu and its card opens
# from there (dumped).
from: early-base
mods: [3797142492]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"RenewableEnergy\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
require_log: ['\[MatrixMachine\] ']
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"RenewableEnergy\").unlockedItemIDs": {contains: MattsMatrixMachine}
      "Assets.GetBuildingDef(\"MattsMatrixMachine\")": exists
  - run: {seconds: 5}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/MattsMatrixMachine Group*", cond: stable, stable: 120, frames: 600}
  - click: {ui: "**/BuildingGroups/**/Grid/MattsMatrixMachine Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - ui_dump: {name: card, root: "**/ProductInfoScreen"}
  - key: {code: Escape}
  - key: {code: Escape}
