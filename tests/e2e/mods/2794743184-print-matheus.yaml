# Print Matheus - It's My Bestfriend With Game Mod (2794743184), class X (content for Dupery).
#
# What it does: no code. With Dupery (here Dupery Fixed, 3172734005; its description requires
# Dupery), its personalities.json adds a printable Duplicant personality, Matheus
# (male, Aggressive stress reaction, Sticker Bomber joy trait), with its hair and head shape from the mod's anim folder.
# How a player reaches it: Duplicants printed or picked for a new colony; the Duplicant's
# Personality tab.
# What changes: another personality in the pool.
#
# Dupery imports the personality into the game's Personalities and loads its accessories.
from: early-base
mods: [3172734005, 2794743184]
require_log: ['\[Dupery\]: accessory hair_matheus successfully loaded']
steps:
  - expect_state:
      "Db.Get().Personalities.TryGet(\"MATHEUS\")": exists
      "Db.Get().Personalities.TryGet(\"MATHEUS\").Disabled": false
      "Db.Get().Accessories.TryGet(\"hair_matheus\")": exists
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 10}
  - expect: {duplicants: 3}
