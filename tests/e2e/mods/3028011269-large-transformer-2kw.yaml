# 大功率变压器功率降低mod (3028011269), class P.
#
# What it does: the Large Power Transformer (PowerTransformer) passes 2 kW instead of 4 kW: a
# postfix on PowerTransformerConfig.CreateBuildingDef sets its generator wattage rating and
# base capacity to 2000 W. (Its mod.yaml names it DGSM, another mod's static ID.)
# How a player reaches it: building a Large Power Transformer.
# What changes: its rating, in the build menu card and on a built one.
#
# The transformer's definition carries the mod's 2000 W (the small one keeps the game's
# 1000 W); the colony runs half a minute.
from: early-base
mods: [3028011269]
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"PowerTransformer\").GeneratorWattageRating": 2000
      "Assets.GetBuildingDef(\"PowerTransformer\").GeneratorBaseCapacity": 2000
      "Assets.GetBuildingDef(\"PowerTransformerSmall\").GeneratorWattageRating": 1000
  - run: {seconds: 30}
