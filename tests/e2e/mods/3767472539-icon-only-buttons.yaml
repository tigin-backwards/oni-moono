# 界面按钮仅图标 / Icon-only buttons (3767472539), class S (PLib options).
#
# What it does: hides the labels of the management menu (top right), the build categories
# (bottom left) and the tool bar (bottom), each by its option, leaving their icons; clicks,
# hotkeys and tooltips are unchanged (KIconToggleMenu, ManagementMenu, PlanScreen and ToolMenu
# patches).
# How a player reaches it: the colony's HUD; the mod's options.
# What changes: a compact HUD.
#
# The build categories and the tool bar are dumped and shot, as in the original, and the
# colony plays for 30 s.
from: early-base
mods: [3767472539]
steps:
  - ui_dump: {name: plan, root: "**/PlanScreen"}
  - shot: {name: plan, crop: "**/PlanScreen", threshold: 0.04}
  - ui_dump: {name: tools, root: "**/ToolMenu"}
  # The bottom-right corner holds the pointer's hover card and, in the original only, Unity's
  # Development Build label: masked.
  - shot: {name: tools, crop: "**/ToolMenu", threshold: 0.04, mask: [[1100, 660, 180, 60]]}
  - run: {seconds: 30}
  - expect: {duplicants: 3}
