# U3 (docs/research/u60-qa-spec.md): the build menu and material selection.
#
# U60 adds the Farming category, renames Stations to Operations, adds subcategory titles
# (PlanScreen.TryGetSubCategoryTitle, String.CompareOrdinal) and missing-resource and research
# hints to the material selection; GridLayoutGroup and toggle layout and TMP wrapping are ours.
#
# From early-base: each category of the build menu opened by its toggle and its building panel
# dumped with the plan screen (the menu settles before each dump; a category with nothing
# available stays closed, in both players).
from: early-base
steps:
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - driver: {buildmenu.settled: {}}
  - ui_wait: {path: "**/BottomPanelLeft/BottomLeftPanel", cond: stable, stable: 30}
  - ui_dump: {name: base, root: "**/BottomPanelLeft/BottomLeftPanel"}
