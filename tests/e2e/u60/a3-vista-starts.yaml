# A3 (docs/research/u60-qa-spec.md): the starting-biome vistas, spawned at worldgen.
#
# U60's base templates spawn a vista entity beside the Printing Pod (templates/bases/
# sandstoneBase.yaml, forestBase.yaml, expansion1's swampBase.yaml, dlc2's ceresBase.yaml;
# dlc5's beachBaseVista.yaml changed), its layers loaded with Resources.Load and unloaded with
# Resources.UnloadAsset (VistaLayers). vista-toggle.yaml covers the projector's toggle; this
# covers the spawn.
#
# From the main menu, a new game per start, each by its coordinate with a fixed seed: Terra
# (V-SNDST-C), Verdante (V-LUSH-C), Squelchy in Spaced Out (SWMP-C), Ceres (V-CER-C) and the
# Beach start (V-AQU-C). After Embark and BEGIN on Wattson's message the camera is on the pod: one
# vista there, and a world shot of it. Then the pause menu's Main Menu, Quit Without Saving,
# and the next.
from: main-menu
memory_gb: 8
steps:
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/VideoScreen", cond: gone, frames: 600}
  # terra: V-SNDST-C
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 6000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "V-SNDST-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput/Text Area/Text", cond: text, value: "~V-SNDST-C-12345-0-0-0"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  # A new colony opens with Wattson's message ("ALERT"), the HUD hidden until BEGIN; its
  # background stays over the button for a while after the button stops moving.
  - ui_wait: {path: "**/WattsonMessage/Dialog/FG/Button", cond: stable, stable: 120, frames: 6000}
  - click: {ui: "**/WattsonMessage/Dialog/FG/Button"}
  - ui_wait: {path: "**/BottomPanelRight/ToolMenu", cond: stable, frames: 6000}
  - expect_state:
      "Components.Vistas.Count": [">= 1", "== original"]
      "Components.Vistas.Items[0].spritePath": "== original"
      "ClusterManager.Instance.GetStartWorld().worldName": "== original"
  - world_shot: {name: terra, ortho: 10}
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  # forest: V-LUSH-C
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 6000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
