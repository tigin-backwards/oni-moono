# The release gate for Direct3D 11, the Vulkan gate's twin (u60/vk-gate): a short run of a colony
# in ours alone on Windows, on Direct3D 11 with the debug layer (docs/research/d3d11-plan.md, done
# criterion 9). Run by scripts/e2e-windows/run.py --player ours u60/d3d11-gate, with
# E2E_PLAYER_ARGS='--renderer d3d11 --d3d11-debug' (the later --renderer wins over WIN_RENDERER's).
#
# The device must be Direct3D 11: the host logs "renderer: Direct3D 11 (d3d11, ...)" when it
# started, and "renderer: Direct3D 11 unavailable (...)" when it fell back. early-base is played
# at speed 3, two overlays and the research screen are opened, and each shot must not look blank
# (`varied`). Ours must log no error or exception signature at all (`allowed_signatures`), and the
# debug layer no error, corruption or warning (done criterion 1): its messages are logged as
# "d3d11 debug layer: D3D11_MESSAGE_SEVERITY_..." the first time each is seen.
from: early-base
expect_log:
  - 'renderer: Direct3D 11 \(d3d11, '
  - 'debug layer on'
  - '\A(?![\s\S]*(d3d11 debug layer: D3D11_MESSAGE_SEVERITY_(CORRUPTION|ERROR|WARNING)|messages dropped past the message count limit))'
allowed_signatures: []
steps:
  - expect_state: {"type:UnityEngine.SystemInfo::graphicsDeviceType": "== 'Direct3D11'"}
  - run: {seconds: 45}
  - world_shot: {name: world, ortho: 12, at: [114, 208], varied: true}
  - key: {code: F1}
  - ui_wait: {path: "**/OverlayLegend", cond: stable}
  - world_shot: {name: oxygen, ortho: 12, at: [114, 208], varied: true}
  - key: {code: F3}
  - ui_wait: {path: "**/OverlayLegend", cond: stable}
  - world_shot: {name: temperature, ortho: 12, at: [114, 208], varied: true}
  - key: {code: F3}
  - ui_wait: {path: "**/BottomPanelRight/ToolMenu", cond: stable}
  - shot: {name: hud, varied: true}
  - open: {management: research}
  - shot: {name: research, varied: true}
  - key: {code: Escape}
  - run: {seconds: 5}
