# R2 (docs/research/u60-qa-spec.md): animation batch pooling.
#
# U60 pools anim batches (KAnimBatchGroup.GetOrCreateBatch/ReleaseBatch, KAnimBatch.Reuse,
# AtlasList.Reset): a batch that empties is kept and reused for the next building of its group,
# keeping its Material, Mesh and instance texture. Our material property state, mesh reuse and
# texture rebinding must not leak the previous contents.
#
# From landing in debug instant-build mode (DebugHandler, set in setup), where the build tool
# and the Deconstruct tool complete at once: a 10x6 area east of the start room dug, then rounds
# of mixed buildings placed through the build menu and cleared with the Deconstruct tool, a world
# shot after each: set A (21 buildings), cleared, set B (27, in other places), cleared, set A
# again in the batches set B left. The kinds are those research has unlocked on landing. Each
# is picked by the build menu's search, which filters 0.2 s of real time after the last key; the
# camera keeps the area clear of the build menu's panels. The start room's floor is 8 tiles.
from: landing
setup:
  - driver: {setup.call: {type: DebugHandler, method: set_enabled, args: [true]}}
  - driver: {setup.call: {type: DebugHandler, method: ToggleInstantBuildMode, args: []}}
  - driver: {camera.set: {pos: [133, 209.5], ortho: 8}}
steps:
  - tool: {toolbar: Dig}
  - drag: {from: [131, 207], to: [140, 212]}
  - key: {code: Escape}
  - run: {seconds: 1, speed: 1}
  # Set A.
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
