  - type: {ui: "**/BuildingGroups/Searchbar/FilterInputField", text: "Cot", clear: true}
  - run: {seconds: 1, speed: 1}
  - ui_wait: {path: "**/BuildingGroups/Viewport/Contents/*/Grid/Bed Group*", cond: active}
  - ui_wait: {path: "**/BuildingGroups/Viewport/Contents", cond: stable}
  - click: {ui: "**/BuildingGroups/Viewport/Contents/*/Grid/Bed Group*"}
  - click_world: {cell: [131, 207]}
  - key: {code: Escape}
  - click: {ui: "**/PlanScreen/Toggle:Plumbing"}
