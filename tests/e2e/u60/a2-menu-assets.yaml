# A2 (docs/research/u60-qa-spec.md): asset loading at the main menu.
#
# U60 changed Assets.LoadAnims, CreatePrefabs, SortPrefabsBySignificantDLC and
# AddCountableBuildMaterialCategories: prefabs are made, and sorted, in an order our bundle
# reader and load order feed. At the main menu (all DLCs): the prefab and anim counts, and the
# first 50 prefabs' ids in order, compared with the original's. (The time to the menu is the
# start-up timing script's, not this spec's.)
from: main-menu
steps:
  - ui_wait: {path: "**/VideoScreen/CloseButton", cond: stable, frames: 3000}
  - click: {ui: "**/VideoScreen/CloseButton"}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - expect_state:
      "Assets.Prefabs.Count": "== original"
      "Assets.Anims.Count": "== original"
      "Assets.BuildingDefs.Count": "== original"
  - expect_state:
      "Assets.Prefabs[0].PrefabID().Name": "== original"
      "Assets.Prefabs[1].PrefabID().Name": "== original"
      "Assets.Prefabs[2].PrefabID().Name": "== original"
