# W1 (docs/research/u60-761654.md): a mod built for .NET Standard 2.1. Since 761654 the game and
# its libraries reference netstandard 2.1.0.0; in ours that reference is .NET's netstandard
# facade, in the original Mono's netstandard.dll. UnityProbe (SemanticsProbe.dll, TargetFramework
# netstandard2.1, built against 761654's Managed: -p:OniManaged=...) runs its `ns21` scenario at
# OnLoad (tools/UnityProbe/NetStandard.cs): values from Linq, HashSet, Span and
# MemoryExtensions, System.Xml.Linq, System.Numerics, System.IO.Compression, culture formatting
# and Type.GetType, each a static field, and a Harmony postfix on Game.OnSpawn, which lists the
# loaded TMP font assets and whether each, and its fallbacks, has U+202F and U+00A0.
# The run needs: SemanticsProbe.dll copied into a copy of OniMcp's mod folder, E2E_ONIMCP pointing
# at the copy, PROBE_SCENARIO=ns21. Each value is compared with the original's, except those
# that differ for reasons known before the retarget, which are recorded only: Vector3.ToString
# and a float's default format (ARCHITECTURE D2, the shortest round trip), Int32's assembly name
# (System.Private.CoreLib against mscorlib), the GZip stream's compressed length (.NET's zlib-ng
# against Mono's zlib, D61; both round-trip) and fr-FR's group separator (U+202F in ours, ICU's;
# U+00A0 in the original, Mono's; D60). The font list is compared: every font has both glyphs,
# itself or through TMP_Settings' fallbacks and the default font asset, which HasCharacter's
# fallback search walks (u60-761654.md, W1; probe-font-fallback.yaml).
from: early-base
require_log: ['NS21 Linq=', 'NS21 NetstandardRef=netstandard 2\.1\.0\.0']
steps:
  - expect_state:
      "type:SemanticsProbe.NetStandard::Done": "yes"
      "type:SemanticsProbe.NetStandard::GameSpawns": [1, "== original"]
      "type:SemanticsProbe.NetStandard::Linq": "== original"
      "type:SemanticsProbe.NetStandard::HashSetValue": "== original"
      "type:SemanticsProbe.NetStandard::SpanValue": "== original"
      "type:SemanticsProbe.NetStandard::XmlValue": "== original"
      "type:SemanticsProbe.NetStandard::VectorValue": {save_as: vectorvalue}
      "type:SemanticsProbe.NetStandard::VectorLength": {save_as: vectorlength}
      "type:SemanticsProbe.NetStandard::GzipRoundTrip": "== original"
      "type:SemanticsProbe.NetStandard::GzipLength": {save_as: gziplength}
      "type:SemanticsProbe.NetStandard::DeflateRoundTrip": "== original"
      "type:SemanticsProbe.NetStandard::FormatDe": "== original"
      "type:SemanticsProbe.NetStandard::FormatFr": {save_as: formatfr}
      "type:SemanticsProbe.NetStandard::FormatRu": "== original"
      "type:SemanticsProbe.NetStandard::FormatInvariant": {save_as: formatinvariant}
      "type:SemanticsProbe.NetStandard::Int32Assembly": {save_as: int32assembly}
      "type:SemanticsProbe.NetStandard::NetstandardRef": "== original"
      "type:SemanticsProbe.NetStandard::Glyphs": "== original"
