# Issue #52: a player loaded a colony, the automation overlay open, and clicked a gate under a
# logic wire before unpausing: each click selected the wire, never the gate, and kept doing so for
# several seconds after unpausing, then cycled as it should. This loads issue-52-gate (an AND gate
# under a logic wire in cell (109, 206), made by issue-52-gate-fixture), opens the automation
# overlay at once and clicks there while paused, then unpauses (a short run first: right after a
# load neither player takes Space or a resume yet) and clicks on for about ten seconds of play.
# Each click selects what the original's does, so ours cycles through the gate and the wire in the
# same order; when each click came and what SelectTool saw are recorded beside it.
#
# issue-52-after-load-ft-bic does the same with Fast Track (a GitHub build, as in
# issue-52-states-ft-bic) and Better Info Cards, the mods in that player's list that change
# click selection.
from: issue-52-gate
steps:
  - driver: {camera.set: {cell: [110, 207], ortho: 8}}
  - key: {code: "Shift+F2"}
  - expect_state: {"OverlayScreen.Instance.GetMode().ToString()": "== original"}
  - click_world: {pos: [109.5, 206.5]}
