# Issue #52 with the player's selection mods: Fast Track (a GitHub build, not on the Workshop:
# install 0.18.5 or 0.18.6 as $ONI_WS/9000000001, which the mod gate allows by hash) and Better
# Info Cards, at their default options. Fast Track's SelectTool.OnLeftClickDown prefix gathers
# what lies under the pointer, calls GetObjectUnderCursor<KSelectable> (its transpiler makes it
# return null; Better Info Cards' postfix picks the next info card) and else cycles itself.
#
# A logic wire, a logic switch and two debris lie in cell (109, 206). It is clicked 30 times
# without an overlay, 30 times in the automation overlay (opened with a selection held) and 10
# times after it closes; each click selects another object than the one before. Fast Track orders
# the stack by a struct hash that differs between processes, so the objects are not compared with
# the original's.
from: early-base
mods: [9000000001, 1960947963]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"LogicControl\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LogicWire\")", method: Build, args: [{"$": "Grid.XYToCell(109, 206)"}, Neutral, null, [Copper], 293.15]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LogicSwitch\")", method: Build, args: [{"$": "Grid.XYToCell(109, 206)"}, Neutral, null, [Copper], 293.15]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"SandStone\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 200, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Dirt\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - driver: {camera.set: {cell: [110, 207], ortho: 8}}
  - run: {seconds: 1, speed: 1}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": {save_as: s0}}
  - click_world: {pos: [109.5, 206.2]}
  - expect_state: {"selected:GetInstanceID()": ["!= s0", {save_as: s1}]}
  - click_world: {pos: [109.5, 206.2]}
