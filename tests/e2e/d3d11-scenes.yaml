# The Direct3D 11 renderer's scene set (docs/research/d3d11-plan.md, M3; done criterion 3),
# first colony: a small landing with four gases side by side, paused after its load, shot the
# same way by ours on each renderer, so scripts/d3d11-scenes.sh can compare D3D11's shots with
# OpenGL's. Ours only, on Windows (scripts/e2e-windows/run.py; the renderer from
# E2E_PLAYER_ARGS). Every shot is of a paused frame: every overlay (set through OniMcp), the UI, the research
# screen and the starmap, then the save's colony preview. d3d11-scenes-base.yaml and
# d3d11-scenes-mid.yaml are the other two colonies.
from: gas-boundary
steps:
  - world_shot: {name: world, ortho: 4, at: [113, 215]}
  - world_shot: {name: world-wide, ortho: 14, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: oxygen}}
  - world_shot: {name: overlay-oxygen, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: power}}
  - world_shot: {name: overlay-power, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: temperature}}
  - world_shot: {name: overlay-temperature, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: heat_flow}}
  - world_shot: {name: overlay-heat-flow, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: conductivity}}
  - world_shot: {name: overlay-conductivity, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: materials}}
