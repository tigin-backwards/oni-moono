  - world_shot: {name: overlay-decor, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: rooms}}
  - world_shot: {name: overlay-rooms, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: germs}}
  - world_shot: {name: overlay-germs, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: radiation}}
  - world_shot: {name: overlay-radiation, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: exosuit}}
  - world_shot: {name: overlay-exosuit, ortho: 4, at: [113, 215]}
  - call: {tool: navigation_control, args: {action: switch_view, view: farming}}
