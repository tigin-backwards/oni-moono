# W10 (docs/research/u60-761654.md): breath recovery at an underwater breathing location.
# 761654's UnderwaterBreathingLocationWorkable sets its work time to its work animations' total
# length at OnStartWork and ends the work in OnWorkTick once the worker's animation has stopped
# on the last work animation; BreathMonitor's recovery chore at a location (a WorkChore on that
# workable, reserved for the Duplicant) changed with it.
#
# The fixture (u60-w10-breathing) is an Aquatic Spaced Out colony of ten Duplicants with a
# saltwater pool of Pufferfish; it was saved by the 761654 original from a save of build 737790
# (its old mod list dropped). Its Pufferfish hold almost no oxygen, so setup builds an Underwater
# Breathing Station in the pool (BuildingDef.Build), puts 30 kg of oxygen in its storage (three
# charges), moves the first Duplicant into the water three cells from it (to cell 101699, that
# is (131, 138)) and sets its breath to 30 (below the retreat amount). The Duplicant swims to the
# station and recovers there.
#
# Every game second at speed 1 for 24 s (OniMcp steps whole seconds): the game clock and frame
# count, the Duplicant's breath, the workable it works on and its animation, and the station's
# work time, time remaining and oxygen stored, recorded for the comparison
# (docs/research/u60-761654.md, "QA results"). Then the station's work time (the animations'
# length) and the oxygen left (one charge used), the Duplicant's recovered breath and that its
# work has ended, against the original's.
from: u60-w10-breathing
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"UnderwaterBreathingStation\")", method: Build, args: [{"$": "Grid.XYToCell(134, 137)"}, {"$": "Orientation.Neutral"}, null, {"$": "Assets.GetBuildingDef(\"UnderwaterBreathingStation\").DefaultElements()"}, 293.15, false, -1]}}
  - driver: {setup.call: {target: "last:GetComponent<Storage>()", method: AddGasChunk, args: [{"$": "SimHashes.Oxygen"}, 30, 293.15, 255, 0, false, true]}}
  - driver: {setup.call: {type: TransformExtensions, method: SetPosition, args: [{"$": "Components.LiveMinionIdentities.Items[0].transform"}, [131.5, 138, -25.5]]}}
  - driver: {setup.call: {target: "Components.LiveMinionIdentities.Items[0].GetComponent<Klei.AI.Modifiers>().amounts.Get(\"Breath\")", method: SetValue, args: [30]}}
steps:
  - expect_state:
      "Components.LiveMinionIdentities.Items[0].name": "== original"
      "count:all:UnderwaterBreathingLocationWorkable::[*] if .name == UnderwaterBreathingStationComplete": [1, "== original"]
      "Components.UnderwaterBreathingLocations.Count": "== original"
      "Grid.IsSubstantialLiquid(101699, 0.35)": [true, "== original"]
  - run: {seconds: 1, speed: 1}
  - expect_state:
      "GameClock.Instance.GetTime()": {save_as: t0}
      "UnityEngine.Time.frameCount": {save_as: f0}
      "Components.LiveMinionIdentities.Items[0].GetComponent<Klei.AI.Modifiers>().amounts.Get(\"Breath\").value": {save_as: b0}
      "Components.LiveMinionIdentities.Items[0].GetComponent<StandardWorker>().GetWorkable()": {save_as: w0}
      "Components.LiveMinionIdentities.Items[0].GetComponent<KBatchedAnimController>().currentAnim.ToString()": {save_as: a0}
      "sum:all:UnderwaterBreathingLocationWorkable::[*].WorkTimeRemaining if .name == UnderwaterBreathingStationComplete": {save_as: r0}
      "sum:all:UnderwaterBreathingLocationWorkable::[*].GetWorkTime() if .name == UnderwaterBreathingStationComplete": {save_as: wt0}
      "sum:all:UnderwaterBreathingLocation::[*].storage.MassStored() if .name == UnderwaterBreathingStationComplete": {save_as: m0}
